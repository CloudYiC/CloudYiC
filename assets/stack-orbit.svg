<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Engineering stack constellation</title><desc id="desc">A neon orbital map connecting CloudYiC with C, C++, Python, Linux, CMake, Docker, Git, React and AI.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#75C9F5"/><stop offset=".52" stop-color="#CBEAFB"/><stop offset="1" stop-color="#FBFDFF"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#FFFFFF" stop-opacity=".78"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#075985" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cloud" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="13"/></filter>
    <clipPath id="clip"><rect width="1200" height="470" rx="22"/></clipPath>
  </defs>
  <style>
    .m{font-family:"Cascadia Code",Consolas,monospace}.u{font-family:Inter,"Segoe UI",Arial,sans-serif}.orbit{animation:spin 35s linear infinite;transform-origin:600px 255px}.counter{animation:spin2 26s linear infinite;transform-origin:600px 255px}.flow{animation:dash 9s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}
    [fill="#0A1422"],[fill="#0A1120"]{fill:#FFFFFF;fill-opacity:.84}[fill="#F8FAFC"],[fill="#F1F5F9"],[fill="#CBD5E1"]{fill:#123B56}[fill="#94A3B8"]{fill:#365F7A}[fill="#64748B"]{fill:#52758C}[fill="#475569"],[fill="#334155"]{fill:#6FA4C2}
    [fill="#67E8F9"],[fill="#A5F3FC"],[fill="#7DD3FC"],[fill="#BAE6FD"]{fill:#0369A1}[fill="#BFDBFE"]{fill:#1D4ED8}[fill="#C7D2FE"],[fill="#C4B5FD"],[fill="#DDD6FE"]{fill:#5B21B6}[fill="#E9D5FF"],[fill="#F3E8FF"]{fill:#7E22CE}
    [stroke="#334155"]{stroke:#75B7DB}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(-360deg)}}@keyframes dash{to{stroke-dashoffset:-160}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.counter,.flow,.pulse{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="470" fill="url(#bg)"/><rect width="1200" height="470" fill="url(#grid)"/><circle cx="600" cy="255" r="330" fill="url(#halo)"/>
    <g fill="#FFFFFF" opacity=".52" filter="url(#cloud)"><ellipse cx="160" cy="42" rx="150" ry="33"/><ellipse cx="258" cy="28" rx="92" ry="44"/><ellipse cx="986" cy="438" rx="170" ry="35"/><ellipse cx="1090" cy="422" rx="100" ry="46"/></g>
    <text class="m" x="40" y="38" fill="#A5B4FC" font-size="13" letter-spacing="2">02 // ENGINEERING STACK CONSTELLATION</text>
    <text class="m" x="1160" y="38" text-anchor="end" fill="#475569" font-size="10">10 NODES / 4 LAYERS / 1 BUILD PATH</text>
    <ellipse class="orbit" cx="600" cy="255" rx="470" ry="158" fill="none" stroke="#334155" stroke-dasharray="3 13"/>
    <ellipse class="counter" cx="600" cy="255" rx="350" ry="115" fill="none" stroke="url(#neon)" stroke-opacity=".3" stroke-dasharray="7 15"/>
    <circle cx="600" cy="255" r="82" fill="#0A1120" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <circle class="pulse" cx="600" cy="255" r="61" fill="none" stroke="#67E8F9" stroke-opacity=".5"/>
    <text class="u" x="600" y="247" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="800">CloudYiC</text>
    <text class="m" x="600" y="271" text-anchor="middle" fill="#67E8F9" font-size="9" letter-spacing="2">ENGINEERING CORE</text>

    <g fill="none" stroke="url(#neon)" stroke-opacity=".22" class="flow" stroke-dasharray="5 9">
      <path d="M526 222L169 151M530 286L208 353M575 180L398 98M667 190L805 102M681 237L1028 175M670 296L978 367M587 335L664 405M531 304L407 390M600 173L600 85"/>
    </g>

    <g class="m">
      <g transform="translate(80 110)"><rect width="178" height="82" rx="13" fill="#0A1422" stroke="#22D3EE" stroke-opacity=".65"/><circle cx="28" cy="28" r="15" fill="#00599C"/><text x="28" y="33" text-anchor="middle" fill="#FFF" font-size="15" font-weight="700">C</text><text x="54" y="31" fill="#A5F3FC" font-size="14">C LANGUAGE</text><text x="18" y="60" fill="#64748B" font-size="10">core · memory · control</text></g>
      <g transform="translate(94 314)"><rect width="190" height="82" rx="13" fill="#0A1422" stroke="#38BDF8" stroke-opacity=".65"/><circle cx="28" cy="28" r="15" fill="#2563EB"/><text x="28" y="33" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">C++</text><text x="54" y="31" fill="#BAE6FD" font-size="14">C++</text><text x="18" y="60" fill="#64748B" font-size="10">systems · abstractions</text></g>
      <g transform="translate(300 58)"><rect width="196" height="78" rx="13" fill="#0A1422" stroke="#60A5FA" stroke-opacity=".65"/><circle cx="28" cy="27" r="15" fill="#3776AB"/><text x="28" y="32" text-anchor="middle" fill="#FFD43B" font-size="12" font-weight="700">Py</text><text x="54" y="30" fill="#BFDBFE" font-size="14">PYTHON</text><text x="18" y="57" fill="#64748B" font-size="10">tools · services · automation</text></g>
      <g transform="translate(505 47)"><rect width="190" height="78" rx="13" fill="#0A1422" stroke="#818CF8" stroke-opacity=".6"/><circle cx="28" cy="27" r="15" fill="#111827" stroke="#FACC15"/><text x="28" y="32" text-anchor="middle" fill="#FACC15" font-size="11">LX</text><text x="54" y="30" fill="#C7D2FE" font-size="14">LINUX</text><text x="18" y="57" fill="#64748B" font-size="10">runtime · shell · systems</text></g>
      <g transform="translate(710 62)"><rect width="196" height="78" rx="13" fill="#0A1422" stroke="#818CF8" stroke-opacity=".65"/><circle cx="28" cy="27" r="15" fill="#064F8C"/><text x="28" y="32" text-anchor="middle" fill="#FFF" font-size="10">CM</text><text x="54" y="30" fill="#C7D2FE" font-size="14">CMAKE</text><text x="18" y="57" fill="#64748B" font-size="10">build · link · reproduce</text></g>
      <g transform="translate(939 134)"><rect width="190" height="82" rx="13" fill="#0A1422" stroke="#A78BFA" stroke-opacity=".65"/><circle cx="28" cy="28" r="15" fill="#2496ED"/><text x="28" y="33" text-anchor="middle" fill="#FFF" font-size="10">DK</text><text x="54" y="31" fill="#DDD6FE" font-size="14">DOCKER</text><text x="18" y="60" fill="#64748B" font-size="10">package · isolate · deliver</text></g>
      <g transform="translate(887 329)"><rect width="190" height="82" rx="13" fill="#0A1422" stroke="#C084FC" stroke-opacity=".65"/><circle cx="28" cy="28" r="15" fill="#F05032"/><text x="28" y="33" text-anchor="middle" fill="#FFF" font-size="10">GT</text><text x="54" y="31" fill="#E9D5FF" font-size="14">GIT</text><text x="18" y="60" fill="#64748B" font-size="10">history · review · ship</text></g>
      <g transform="translate(568 367)"><rect width="196" height="78" rx="13" fill="#0A1422" stroke="#C084FC" stroke-opacity=".65"/><circle cx="28" cy="27" r="15" fill="#082F49" stroke="#61DAFB"/><text x="28" y="32" text-anchor="middle" fill="#61DAFB" font-size="10">RX</text><text x="54" y="30" fill="#E9D5FF" font-size="14">REACT</text><text x="18" y="57" fill="#64748B" font-size="10">learning · interface · feedback</text></g>
      <g transform="translate(306 351)"><rect width="196" height="78" rx="13" fill="#0A1422" stroke="#A855F7" stroke-opacity=".65"/><circle cx="28" cy="27" r="15" fill="#4C1D95"/><text x="28" y="32" text-anchor="middle" fill="#FFF" font-size="11">AI</text><text x="54" y="30" fill="#F3E8FF" font-size="14">AI ENGINEERING</text><text x="18" y="57" fill="#64748B" font-size="10">explore · assist · evaluate</text></g>
    </g>
    <text class="m" x="600" y="457" text-anchor="middle" fill="#334155" font-size="9" letter-spacing="2">LOW LEVEL → SYSTEM → TOOLCHAIN → INTERFACE</text>
  </g>
</svg>
